
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  build:
    commands:
      - echo "Building Spring Boot application"
      - mvn package -DskipTests

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

cache:
  paths:
    - /root/.m2/**/*
