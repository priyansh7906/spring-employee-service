
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Checking project files"
      - ls -la
      - test -f pom.xml
      - echo "Building Spring Boot application"
      - mvn package

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

cache:
  paths:
    - /root/.m2/**/*
